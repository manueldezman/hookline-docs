# Vale checks prose style. Rules live in .vale/styles.
StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Project

# `vale sync` downloads these packages into StylesPath.
Packages = Google

# Apply to Markdown and MDX pages in docs/.
[docs/**/*.{md,mdx}]
BasedOnStyles = Vale, Google, Hookline

# Ignore JSX tags such as <Tabs> and <TabItem value="npm">.
TokenIgnores = (<\/?[A-Z][^>\n]*>)

# codespell handles spelling, and Vale's dictionary is noisy on code terms.
Vale.Spelling = NO

# Rules at `error` level fail CI. Everything else is advice.
Vale.Terms = error
Google.Headings = error
Google.WordList = error
Google.Passive = warning
