<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="12%" r="85%">
      <stop offset="0" stop-color="#C7D2FE" stop-opacity=".55"/>
      <stop offset="1" stop-color="#C7D2FE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E1B4B" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glow)"/>
  <circle cx="98" cy="46" r="110" fill="#A5B4FC" opacity=".45" filter="url(#soft)"/>
  <circle cx="560" cy="314" r="130" fill="#818CF8" opacity=".48" filter="url(#soft)"/>
  <rect width="640" height="360" fill="url(#grid)"/>

  <g filter="url(#shadow)">
    <rect x="54" y="54" width="532" height="252" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
    <rect x="54" y="54" width="532" height="48" rx="18" fill="#1F2937"/>
    <circle cx="82" cy="78" r="5" fill="#F87171"/>
    <circle cx="100" cy="78" r="5" fill="#FBBF24"/>
    <circle cx="118" cy="78" r="5" fill="#34D399"/>

    <rect x="82" y="122" width="280" height="112" rx="14" fill="#0F172A" stroke="#374151" stroke-width="2"/>
    <rect x="390" y="122" width="146" height="112" rx="14" fill="#1F2937" stroke="#374151" stroke-width="2"/>

    <path d="M115 180h150" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <path d="M115 196h110" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
    <path d="M115 212h130" stroke="#374151" stroke-width="2" stroke-linecap="round"/>

    <rect x="104" y="132" width="150" height="30" rx="8" fill="#F59E0B" opacity=".9"/>
    <text x="119" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#fff">Retrying</text>

    <path d="M410 148l36 0" stroke="#FBBF24" stroke-width="12" stroke-linecap="round"/>
    <path d="M410 178l58 0" stroke="#F59E0B" stroke-width="12" stroke-linecap="round"/>
    <path d="M410 208l42 0" stroke="#FCA5A5" stroke-width="12" stroke-linecap="round"/>

    <circle cx="495" cy="142" r="30" fill="#F59E0B" opacity=".2"/>
    <path d="M495 130l0 18" stroke="#FBBF24" stroke-width="7" stroke-linecap="round"/>
    <path d="M495 162l0 8" stroke="#FBBF24" stroke-width="7" stroke-linecap="round"/>

    <circle cx="495" cy="210" r="20" fill="#F97316" opacity=".18"/>
    <path d="M495 198l0 14" stroke="#FBBF24" stroke-width="7" stroke-linecap="round"/>
    <path d="M484 220l22-14" stroke="#FBBF24" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
