<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="16%" r="80%">
      <stop offset="0" stop-color="#C7D2FE" stop-opacity=".5"/>
      <stop offset="1" stop-color="#C7D2FE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E1B4B" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glow)"/>
  <circle cx="96" cy="44" r="118" fill="#A5B4FC" opacity=".45" filter="url(#soft)"/>
  <circle cx="566" cy="318" r="130" fill="#818CF8" opacity=".5" filter="url(#soft)"/>
  <rect width="640" height="360" fill="url(#grid)"/>

  <g filter="url(#shadow)">
    <rect x="86" y="66" width="468" height="228" rx="16" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <path d="M86 108h468" stroke="#1E293B" stroke-width="2"/>
    <circle cx="110" cy="87" r="5" fill="#F87171"/>
    <circle cx="127" cy="87" r="5" fill="#FBBF24"/>
    <circle cx="144" cy="87" r="5" fill="#34D399"/>
    <text x="500" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#475569">SDK</text>

    <rect x="110" y="130" width="96" height="30" rx="15" fill="#4F46E5"/>
    <text x="158" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#E0E7FF" text-anchor="middle">Node.js</text>

    <rect x="216" y="130" width="96" height="30" rx="15" fill="none" stroke="#4F46E5" stroke-width="2"/>
    <text x="264" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#C7D2FE" text-anchor="middle">Python</text>

    <rect x="110" y="182" width="140" height="9" rx="4.5" fill="#818CF8"/>
    <rect x="262" y="182" width="74" height="9" rx="4.5" fill="#475569"/>
    <rect x="348" y="182" width="52" height="9" rx="4.5" fill="#34D399"/>

    <rect x="110" y="206" width="108" height="9" rx="4.5" fill="#475569"/>
    <rect x="230" y="206" width="150" height="9" rx="4.5" fill="#FBBF24"/>

    <rect x="110" y="230" width="196" height="9" rx="4.5" fill="#94A3B8"/>
    <rect x="110" y="254" width="88" height="9" rx="4.5" fill="#475569"/>
    <rect x="210" y="254" width="64" height="9" rx="4.5" fill="#34D399"/>

    <rect x="406" y="182" width="3" height="26" fill="#E2E8F0"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="432" y="238" width="146" height="56" rx="12" fill="#FFFFFF"/>
    <text x="505" y="273" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#3730A3" text-anchor="middle">npm i @hookline</text>
  </g>
