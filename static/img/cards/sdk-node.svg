<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="14%" r="80%">
      <stop offset="0" stop-color="#A5B4FC" stop-opacity=".5"/>
      <stop offset="1" stop-color="#A5B4FC" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E1B4B" flood-opacity=".32"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glow)"/>
  <circle cx="92" cy="312" r="128" fill="#818CF8" opacity=".22"/>
  <circle cx="560" cy="52" r="112" fill="#A5B4FC" opacity=".24"/>

  <g filter="url(#shadow)">
    <rect x="52" y="72" width="536" height="212" rx="16" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <path d="M52 108h536" stroke="#1E293B" stroke-width="2"/>
    <circle cx="76" cy="90" r="5" fill="#F87171"/>
    <circle cx="93" cy="90" r="5" fill="#FBBF24"/>
    <circle cx="110" cy="90" r="5" fill="#34D399"/>
    <text x="472" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.4" fill="#64748B">NODE.JS</text>

    <text x="76" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.8" fill="#A5B4FC">import</text>
    <text x="130" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.8" fill="#E2E8F0">{ Hookline }</text>
    <text x="232" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.8" fill="#A5B4FC">from</text>
    <text x="272" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.8" fill="#86EFAC">'@hookline/sdk'</text>

    <text x="76" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.8" fill="#A5B4FC">const</text>
    <text x="122" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.8" fill="#E2E8F0">hookline = </text>
    <text x="216" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.8" fill="#A5B4FC">new</text>
    <text x="244" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.8" fill="#E2E8F0">Hookline(key)</text>

    <text x="76" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.8" fill="#A5B4FC">await</text>
    <text x="122" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.8" fill="#E2E8F0">hookline.events.create({</text>
    <text x="122" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.8" fill="#E2E8F0">type: </text>
    <text x="164" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.8" fill="#86EFAC">'invoice.paid'</text>
    <text x="270" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.8" fill="#E2E8F0">})</text>

    <text x="76" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#475569">TypeScript and JavaScript</text>
  </g>

  <g>
    <polygon points="500,242 530,259 530,293 500,310 470,293 470,259" fill="#22C55E"/>
    <text x="500" y="285" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#052E16">JS</text>
  </g>
