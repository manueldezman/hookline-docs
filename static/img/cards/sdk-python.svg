    <text x="478" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.4" fill="#64748B">PYTHON</text>

    <text x="76" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.8" fill="#A5B4FC">from</text>
    <text x="120" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.8" fill="#E2E8F0">hookline </text>
    <text x="192" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.8" fill="#A5B4FC">import</text>
    <text x="252" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.8" fill="#E2E8F0">Hookline</text>

    <text x="76" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.8" fill="#E2E8F0">hookline = Hookline(api_key)</text>

