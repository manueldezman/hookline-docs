    <rect x="52" y="72" width="536" height="212" rx="16" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <path d="M52 108h536" stroke="#1E293B" stroke-width="2"/>
    <circle cx="76" cy="90" r="5" fill="#F87171"/>
    <circle cx="93" cy="90" r="5" fill="#FBBF24"/>
