    <text x="254" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.8" fill="#E2E8F0">)</text>

    <text x="76" y="258" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#475569">Python 3.9 or later</text>
