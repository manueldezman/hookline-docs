    <rect x="452" y="246" width="118" height="74" rx="12" fill="#FFFFFF"/>
    <text x="511" y="295" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" fill="#B45309" text-anchor="middle">{ }</text>
