<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="glow" cx="22%" cy="82%" r="80%">
      <stop offset="0" stop-color="#FDE68A" stop-opacity=".5"/>
      <stop offset="1" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".09"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#451A03" flood-opacity=".38"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glow)"/>
  <circle cx="110" cy="310" r="130" fill="#FDE68A" opacity=".45" filter="url(#soft)"/>
  <circle cx="560" cy="40" r="120" fill="#FBBF24" opacity=".55" filter="url(#soft)"/>
  <rect width="640" height="360" fill="url(#grid)"/>

  <g filter="url(#shadow)">
    <rect x="96" y="58" width="448" height="238" rx="14" fill="#0F172A" stroke="#334155" stroke-width="2"/>

    <rect x="114" y="86" width="84" height="28" rx="8" fill="#0D9488"/>
    <text x="156" y="106" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#CCFBF1" text-anchor="middle">GET</text>
    <rect x="214" y="92" width="170" height="10" rx="5" fill="#475569"/>
    <rect x="214" y="108" width="110" height="8" rx="4" fill="#1E293B"/>
    <path d="M500 90l8 8-8 8" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="114" y="140" width="84" height="28" rx="8" fill="#4F46E5"/>
    <text x="156" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#E0E7FF" text-anchor="middle">POST</text>
    <rect x="214" y="146" width="150" height="10" rx="5" fill="#475569"/>
    <rect x="214" y="162" width="95" height="8" rx="4" fill="#1E293B"/>
    <path d="M500 144l8 8-8 8" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="114" y="194" width="84" height="28" rx="8" fill="#B45309"/>
    <text x="156" y="214" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#FEF3C7" text-anchor="middle">PATCH</text>
    <rect x="214" y="200" width="160" height="10" rx="5" fill="#475569"/>
    <rect x="214" y="216" width="105" height="8" rx="4" fill="#1E293B"/>
    <path d="M500 198l8 8-8 8" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="114" y="248" width="84" height="28" rx="8" fill="#B91C1C"/>
    <text x="156" y="268" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FEE2E2" text-anchor="middle">DELETE</text>
    <rect x="214" y="254" width="140" height="10" rx="5" fill="#475569"/>
    <rect x="214" y="270" width="90" height="8" rx="4" fill="#1E293B"/>
    <path d="M500 252l8 8-8 8" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

