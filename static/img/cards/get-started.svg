<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="10%" r="80%">
      <stop offset="0" stop-color="#C7D2FE" stop-opacity=".55"/>
      <stop offset="1" stop-color="#C7D2FE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E1B4B" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glow)"/>
  <circle cx="110" cy="52" r="120" fill="#A5B4FC" opacity=".5" filter="url(#soft)"/>
  <circle cx="570" cy="318" r="130" fill="#818CF8" opacity=".55" filter="url(#soft)"/>
  <rect width="640" height="360" fill="url(#grid)"/>

  <g filter="url(#shadow)">
    <rect x="104" y="74" width="432" height="212" rx="14" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <path d="M104 112h432" stroke="#1E293B" stroke-width="2"/>
    <circle cx="126" cy="93" r="5" fill="#F87171"/>
    <circle cx="142" cy="93" r="5" fill="#FBBF24"/>
    <circle cx="158" cy="93" r="5" fill="#34D399"/>
    <rect x="128" y="134" width="120" height="10" rx="5" fill="#818CF8"/>
    <rect x="258" y="134" width="70" height="10" rx="5" fill="#475569"/>
    <rect x="150" y="156" width="200" height="10" rx="5" fill="#34D399"/>
    <rect x="150" y="178" width="150" height="10" rx="5" fill="#FBBF24"/>
    <rect x="128" y="200" width="90" height="10" rx="5" fill="#94A3B8"/>
    <rect x="128" y="222" width="170" height="10" rx="5" fill="#475569"/>
    <rect x="306" y="220" width="3" height="14" fill="#E2E8F0"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="396" y="42" width="152" height="42" rx="21" fill="#FFFFFF"/>
    <text x="472" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#4338CA" text-anchor="middle">POST /events</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="72" y="266" width="154" height="46" rx="23" fill="#FFFFFF"/>
    <circle cx="98" cy="289" r="7" fill="#10B981"/>
    <text x="114" y="296" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="600" fill="#0F172A">202 queued</text>
  </g>
</svg>
